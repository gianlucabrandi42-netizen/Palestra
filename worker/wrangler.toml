# Servizio push dell'app Palestra — pubblicato da .github/workflows/push-worker.yml
name = "palestra-push"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "TIMER"
class_name = "Timer"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "Keys"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Timer", "Keys"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]

[ai]
binding = "AI"

[observability]
enabled = true
