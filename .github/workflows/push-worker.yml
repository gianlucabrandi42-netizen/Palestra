# Pubblica il servizio delle notifiche (cartella worker/) su Cloudflare Workers.
# Servono due segreti del repository: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Servizio notifiche (Cloudflare)
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/push-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla i segreti
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Segreti Cloudflare mancanti: pubblicazione saltata."; fi
      - name: Verifica token e ID account (senza mostrarli)
        id: acc
        if: steps.chk.outputs.ok == '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          A_CLEAN=$(printf '%s' "$A" | tr -d '[:space:]')
          echo "ID account: ${#A} caratteri (senza spazi: ${#A_CLEAN}); formato 32 esadecimali: $(printf '%s' "$A_CLEAN" | grep -Eq '^[0-9a-f]{32}$' && echo sì || echo NO)"
          echo -n "Token valido: "; curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.success'
          echo "Account visibili dal token:"
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r --arg a "$A_CLEAN" '.result[]? | "- " + .name + (if .id == $a then "  ← coincide con il segreto" else "  (id diverso dal segreto)" end)'
          # ID da usare: quello del segreto se giusto, altrimenti l'unico account visto dal token
          IDS=$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]?.id')
          if printf '%s\n' "$IDS" | grep -qx "$A_CLEAN"; then USE="$A_CLEAN"; elif [ "$(printf '%s\n' "$IDS" | grep -c .)" = "1" ]; then USE="$IDS"; echo "Uso l'unico account visto dal token."; else echo "::error::ID account non valido e più account disponibili: correggi il segreto CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          echo "::add-mask::$USE"; echo "id=$USE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
      - name: Pubblica su Cloudflare
        if: steps.chk.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.acc.outputs.id }}
          wranglerVersion: "4"
          workingDirectory: worker
          command: deploy
      - name: Segreti per l'analisi delle foto (se presenti)
        if: steps.chk.outputs.ok == '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acc.outputs.id }}
          K: ${{ secrets.ANTHROPIC_API_KEY }}
          G: ${{ secrets.GEMINI_API_KEY }}
          C: ${{ secrets.FOTO_CODICE }}
        run: |
          # 22/11/2026: senza segreti l'analisi usa Cloudflare Workers AI (gratis). Segreti facoltativi.
          if [ -n "$G" ]; then printf '%s' "$G" | npx -y wrangler@4 secret put GEMINI_API_KEY; echo "Gemini attivo."; fi
          if [ -n "$K" ]; then printf '%s' "$K" | npx -y wrangler@4 secret put ANTHROPIC_API_KEY; echo "Anthropic attivo."; fi
          if [ -n "$C" ]; then printf '%s' "$C" | npx -y wrangler@4 secret put FOTO_CODICE; echo "Codice dell'app richiesto."; fi
          echo "Analisi foto: Cloudflare Workers AI gratis, salvo segreti sopra."
      - name: Prova del servizio
        if: steps.chk.outputs.ok == '1'
        run: |
          U=https://palestra-push.gianluca-brandi42.workers.dev
          sleep 5
          echo "GET /        → $(curl -s $U/)"
          echo "GET /vapid   → $(curl -s $U/vapid | jq -r '.key | length') caratteri di chiave pubblica"
          echo "CORS         → $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://gianlucabrandi42-netizen.github.io' -H 'Access-Control-Request-Method: POST' $U/schedule)"
          echo "richiesta errata → $(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' $U/schedule) (atteso 400)"
          test "$(curl -s $U/vapid | jq -r '.key | length')" = "87"
          # backup cifrato: scrive e rilegge un dato di prova con un id di test
          VID=$(printf 'prova-workflow' | sha256sum | cut -c1-64)
          echo "vault put   → $(curl -s -X POST -H 'Content-Type: application/json' -d "{\"id\":\"$VID\",\"data\":\"PROVA-$(date +%s)\",\"at\":1}" $U/vault/put)"
          echo "vault get   → $(curl -s -X POST -H 'Content-Type: application/json' -d "{\"id\":\"$VID\"}" $U/vault/get | jq -c '{at, data}')"
          curl -s -X POST -H 'Content-Type: application/json' -d "{\"id\":\"$VID\"}" $U/vault/get | jq -e '.data | startswith("PROVA-")' > /dev/null
          echo "analisi foto → $(curl -s -X POST -H 'Content-Type: application/json' -d '{}' $U/food/status | jq -c '{configured, needCode, via, error}')"
          echo "prova testo  → $(curl -s -m 60 -X POST -H 'Content-Type: application/json' -d '{"mode":"testo","text":"un piatto di pasta al pomodoro con parmigiano"}' $U/food/photo | jq -c '{piatto, via, error, items: [.items[]? | {n, g, kcal}]}')"
          IMG=$(base64 -w0 icons/icon-192.png 2>/dev/null || true)
          if [ -n "$IMG" ]; then printf '{"mode":"piatto","mime":"image/png","img":"%s"}' "$IMG" > /tmp/foto.json; echo "prova foto   → $(curl -s -m 60 -X POST -H 'Content-Type: application/json' --data @/tmp/foto.json $U/food/photo | jq -c '{piatto, via, error, n: (.items // [] | length)}') (immagine di prova: l'icona dell'app)"; fi
